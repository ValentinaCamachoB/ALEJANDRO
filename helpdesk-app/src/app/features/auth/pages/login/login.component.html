<div class="auth-container">
  <div class="auth-card">
    <h2>Iniciar Sesión</h2>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">Correo</label>
        <input formControlName="email" id="email" type="email" placeholder="correo@ejemplo.com" />
        <small class="error" *ngIf="isInvalid('email', 'required')">
          El correo es obligatorio.
        </small>
        <small class="error" *ngIf="isInvalid('email', 'email')">
          Ingresa un correo electrónico válido.
        </small>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input formControlName="password" id="password" type="password" placeholder="••••••••" />
        <small class="error" *ngIf="isInvalid('password', 'required')">
          La contraseña es obligatoria.
        </small>
      </div>

      <small class="error server-error" *ngIf="serverError">
        {{ serverError }}
      </small>

      <button type="submit">Ingresar</button>
    </form>

    <p class="switch-link">
      ¿No tienes cuenta? <a routerLink="/auth/register">Regístrate</a>
    </p>
  </div>
</div>
