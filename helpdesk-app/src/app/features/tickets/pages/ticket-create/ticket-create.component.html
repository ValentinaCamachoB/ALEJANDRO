<div class="page-container">
  <div class="card">
    <h2>Crear Ticket</h2>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="title">Título</label>
        <input formControlName="title" id="title" type="text" placeholder="Resumen del problema" />
        <small class="error" *ngIf="isInvalid('title', 'required')">
          El título es obligatorio.
        </small>
      </div>

      <div class="form-group">
        <label for="description">Descripción</label>
        <textarea formControlName="description" id="description" rows="5" placeholder="Describe el problema en detalle"></textarea>
        <small class="error" *ngIf="isInvalid('description', 'required')">
          La descripción es obligatoria.
        </small>
      </div>

      <div class="form-group">
        <label for="priority">Prioridad</label>
        <select formControlName="priority" id="priority">
          <option value="low">Baja</option>
          <option value="medium">Media</option>
          <option value="high">Alta</option>
          <option value="urgent">Urgente</option>
        </select>
      </div>

      <small class="error server-error" *ngIf="serverError">{{ serverError }}</small>

      <div class="actions">
        <button type="button" class="btn-secondary" (click)="onCancel()">Cancelar</button>
        <button type="submit">Crear ticket</button>
      </div>
    </form>
  </div>
</div>
