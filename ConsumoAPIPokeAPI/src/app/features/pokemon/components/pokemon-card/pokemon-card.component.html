<article class="pokemon-card">
  <div class="pokemon-card__image-wrapper">
    <img
      [src]="pokemon.image"
      [alt]="pokemon.name"
      class="pokemon-card__image"
    />
  </div>

  <div class="pokemon-card__body">
    <span class="pokemon-card__id">#{{ pokemon.id }}</span>
    <h3 class="pokemon-card__name">{{ pokemon.name }}</h3>

    <div class="pokemon-card__types">
      <span
        *ngFor="let type of pokemon.types"
        class="pokemon-card__type"
        (click)="onTypeClick(type)"
        title="Ver detalle de este tipo"
      >
        {{ type }}
      </span>
    </div>

    <div class="pokemon-card__info">
      <p>
        <strong>Altura:</strong>
        {{ pokemon.height }}
      </p>
      <p>
        <strong>Peso:</strong>
        {{ pokemon.weight }}
      </p>
      <p>
        <strong>Experiencia base:</strong>
        {{ pokemon.baseExperience }}
      </p>
      <p>
        <strong>Habilidades:</strong>
        {{ pokemon.abilities.join(', ') }}
      </p>
    </div>
  </div>
</article>
